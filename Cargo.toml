[package]
name = "openakko"
version = "0.2.0"
edition = "2021"
description = "Open Akko: native Linux configurator for Akko keyboards (YC3121/YC500 family). Offline, no telemetry."
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
